# ==============================================================================
#   PHANTOM NODE - SESSION RETRIEVAL PHASE (RDP ENABLER) - FIXED
#   Target: Download, install, and configure Antigravity IDE for manual RDP login
#   Methodology: Hieu Methodology - Maximum Stability & Automation
#   Bypass: Defender Policy Block, Google Auth Rendering Issues
# ==============================================================================

version: 1.0.{build}
image: Visual Studio 2019

shallow_clone: true
clone_depth: 1

branches:
  only:
    - main

environment:
  # Cấu hình mật khẩu RDP cố định để kết nối từ điện thoại
  APPVEYOR_RDP_PASSWORD: "HieuDz@123456"
  APP_DOWNLOAD_URL: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe"

init:
  # Kích hoạt tính năng RDP của AppVeyor ngay từ đầu
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

build: off

install:
  - ps: |
      $ErrorActionPreference = "Stop"
      
      # 1. BẢO VỆ TIẾN TRÌNH: Tắt Defender có try/catch để tránh lỗi Group Policy chặn build
      Write-Host "[*] Đang thử vô hiệu hóa Windows Defender..." -ForegroundColor Cyan
      try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          Write-Host "[+] Đã vô hiệu hóa Windows Defender thành công." -ForegroundColor Green
      } catch {
          Write-Host "[-] Defender Policy bị khóa bởi hệ thống. Bỏ qua bước này để tiếp tục cài đặt." -ForegroundColor Yellow
      }
      
      # 2. Cài đặt Chrome Standalone (Cực kỳ quan trọng để render khung đăng nhập Google)
      Write-Host "[*] Đang tải và cài đặt Google Chrome..." -ForegroundColor Cyan
      $chromePath = "$env:TEMP\chrome_installer.exe"
      Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromePath
      Start-Process $chromePath -ArgumentList "/silent /install" -Wait
      
      # Tự động cấu hình Chrome làm trình duyệt mặc định
      $browserReg = "HKLM:\SOFTWARE\Clients\StartMenuInternet\Google Chrome\Capabilities\URLAssociations"
      $items = Get-Item -Path $browserReg
      foreach ($val in $items.GetValueNames()) {
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\$val\UserChoice" -Name "ProgId" -Value "ChromeHTML" -ErrorAction SilentlyContinue
      }
      Write-Host "[+] Google Chrome đã được cấu hình mặc định." -ForegroundColor Green

      # 3. Cài đặt Antigravity IDE hoàn toàn tự động
      Write-Host "[*] Đang tải bộ cài Antigravity IDE..." -ForegroundColor Yellow
      $setupFile = "$env:TEMP\Antigravity_Setup.exe"
      
      # Dọn dẹp các tiến trình cài đặt cũ đang chạy ngầm nếu có
      Stop-Process -Name "Antigravity*" -Force -ErrorAction SilentlyContinue
      
      Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile $setupFile
      
      Write-Host "[*] Đang cài đặt Antigravity IDE trong nền..." -ForegroundColor Yellow
      # Chạy trình cài đặt ở chế độ Very Silent và bắt buộc chờ hoàn tất
      $installProcess = Start-Process $setupFile -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru -Wait
      
      # Đợi thêm 5 giây để hệ thống ghi đè file hoàn tất
      Start-Sleep -Seconds 5
      
      # 4. Tạo Shortcut ra Desktop để mở trực tiếp
      $exePath = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
      if (Test-Path $exePath) {
          $ws = New-Object -ComObject WScript.Shell
          $s = $ws.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity IDE.lnk")
          $s.TargetPath = $exePath
          $s.Save()
          Write-Host "[+] Cài đặt Antigravity thành công! Shortcut đã được tạo trên Desktop." -ForegroundColor Green
      } else {
          Write-Warning "[-] Không tìm thấy file Antigravity.exe tại đường dẫn mặc định."
      }

test_script:
  - ps: |
      Write-Host "=================================================================" -ForegroundColor Green
      Write-Host "             HỆ THỐNG PHANTOM NODE ĐÃ SẴN SÀNG                   " -ForegroundColor Green
      Write-Host "=================================================================" -ForegroundColor Green
      Write-Host " HƯỚNG DẪN LẤY ANTIGRAVITY SESSION BẰNG ĐIỆN THOẠI:" -ForegroundColor Yellow
      Write-Host " 1. Kết nối RDP bằng app RD Client trên điện thoại của bạn."
      Write-Host "    - IP & Port: Xem ở dòng log RDP phía trên của AppVeyor."
      Write-Host "    - Username: appveyor"
      Write-Host "    - Password: $env:APPVEYOR_RDP_PASSWORD"
      Write-Host " 2. Khi vào màn hình Desktop của máy ảo, nhấp đúp icon 'Antigravity IDE'."
      Write-Host "    --> TUYỆT ĐỐI KHÔNG tự chạy lại tệp cài đặt nào trong folder Downloads!" -ForegroundColor Red
      Write-Host " 3. Tiến hành đăng nhập tài khoản Google và GitHub thủ công."
      Write-Host " 4. Khi đăng nhập thành công và vào tới giao diện làm việc chính,"
      Write-Host "    mở PowerShell trên máy ảo và chạy lệnh đóng gói session:"
      Write-Host '    Compress-Archive -Path "$env:USERPROFILE\.antigravity" -DestinationPath "$env:USERPROFILE\Desktop\session.zip" -Force'
      Write-Host " 5. Tải file 'session.zip' từ Desktop lên gofile.io để lấy link."
      Write-Host "=================================================================" -ForegroundColor Green
      
      # Duy trì kết nối máy ảo trong 90 phút
      for ($i = 1; $i -le 90; $i++) {
          $ram = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024 / 1024, 2)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Keep-Alive: $i/90 phút | RAM trống: ${ram}GB"
          Start-Sleep -Seconds 60
          $wsh = New-Object -ComObject WScript.Shell
          $wsh.SendKeys("{F15}")
      }
      
