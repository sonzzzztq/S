version: 1.0.{build}
image: Visual Studio 2022

environment:
  SESSION_DOWNLOAD_URL: "https://github.com/sonzzzztq/S/releases/download/v1.0/session.zip"
  DEEPSEEK_TOKEN: "-RQc4YpLKeoQ6DwjMArwErwc2szSS56A9dZPhGkQSTkbS6cvVEm78kM7TOMQxEYg"
  APP_DOWNLOAD_URL: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe"

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  - ps: |
      $ErrorActionPreference = "Stop"

      Write-Host "===========================================================" -ForegroundColor Magenta
      Write-Host " KHỞI CHẠY PHANTOM NODE - APPVEYOR OPTIMIZED V5 (NO-BOM)" -ForegroundColor Magenta
      Write-Host "===========================================================" -ForegroundColor Magenta

      Write-Host "[*] Đang xác thực tính toàn vẹn của môi trường..." -ForegroundColor Cyan
      $RequiredVars = @("SESSION_DOWNLOAD_URL", "DEEPSEEK_TOKEN", "APP_DOWNLOAD_URL")
      foreach ($Var in $RequiredVars) {
          $Val = [Environment]::GetEnvironmentVariable($Var)
          if ([string]::IsNullOrWhiteSpace($Val)) {
              Write-Host "[!] LỖI CHÍ MẠNG: Thiếu biến môi trường bắt buộc '$Var'." -ForegroundColor Red
              Exit 1
          }
      }
      Write-Host "[+] Xác thực thành công. Bắt đầu triển khai." -ForegroundColor Green

      function Wait-ForFile {
          param([string]$Path, [int]$TimeoutSec = 20)
          $Start = Get-Date
          while (((Get-Date) - $Start).TotalSeconds -lt $TimeoutSec) {
              if (Test-Path $Path) { return $true }
              Start-Sleep -Milliseconds 500
          }
          return $false
      }

      function Wait-ForPort {
          param([string]$IP, [int]$Port, [int]$TimeoutSec = 20)
          $Start = Get-Date
          while (((Get-Date) - $Start).TotalSeconds -lt $TimeoutSec) {
              $Tcp = New-Object System.Net.Sockets.TcpClient
              try {
                  $Tcp.Connect($IP, $Port)
                  $Tcp.Close()
                  return $true
              } catch {}
              Start-Sleep -Milliseconds 500
          }
          return $false
      }

      Write-Host "[*] Đang tối ưu hóa hệ điều hành máy ảo AppVeyor..." -ForegroundColor Cyan
      try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
      $ServicesToKill = @("wsearch", "DiagTrack", "SysMain", "WerSvc", "Spooler")
      foreach ($Svc in $ServicesToKill) {
          Stop-Service -Name $Svc -Force -ErrorAction SilentlyContinue
          Set-Service -Name $Svc -StartupType Disabled -ErrorAction SilentlyContinue
      }

      Write-Host "[*] Đang cấu hình Node.js LTS..." -ForegroundColor Cyan
      $ErrorActionPreference = "SilentlyContinue"
      Install-Product node 18 | Out-Null
      $ErrorActionPreference = "Stop"

      $ChromePath = "$env:TEMP\chrome_installer.exe"
      try {
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $ChromePath -TimeoutSec 60
          Start-Process $ChromePath -ArgumentList "/silent /install" -Wait
      } catch {}

      Write-Host "[*] Khôi phục ký ức Agent..." -ForegroundColor Green
      $ConfigDir = "$env:USERPROFILE\.antigravity"
      if (!(Test-Path $ConfigDir)) { New-Item -ItemType Directory -Path $ConfigDir -Force | Out-Null }
      $SessionZip = "$env:TEMP\session.zip"

      $DriveUrl = $env:SESSION_DOWNLOAD_URL
      if (!$DriveUrl.Contains("confirm=t")) { $DriveUrl += if ($DriveUrl.Contains("?")) { "&confirm=t" } else { "?confirm=t" } }

      try {
          Invoke-WebRequest -Uri $DriveUrl -OutFile $SessionZip -UserAgent "Mozilla/5.0" -TimeoutSec 90
          Expand-Archive -Path $SessionZip -DestinationPath $ConfigDir -Force
          Write-Host "[+] Đã nạp thành công bộ nhớ Agent." -ForegroundColor Green
      } catch {
          Write-Host "[!] LỖI CHÍ MẠNG: Tải Session thất bại: $($_.Exception.Message)" -ForegroundColor Red
          Exit 1
      }

      Write-Host "[*] Khởi tạo Lõi API DeepSeek (ds2api)..." -ForegroundColor Yellow
      $Ds2apiDir = "C:\ds2api"
      New-Item -ItemType Directory -Path $Ds2apiDir -Force | Out-Null
      try {
          $ApiUrl = "https://api.github.com/repos/CJackHwang/ds2api/releases/latest"
          $Release = Invoke-RestMethod -Uri $ApiUrl
          $Asset = $Release.assets | Where-Object { $_.name -match "windows_amd64\.zip$" }
          if (!$Asset) { throw "Không tìm thấy file ds2api." }
          Invoke-WebRequest -Uri $Asset.browser_download_url -OutFile "C:\ds2api.zip" -TimeoutSec 60
          Expand-Archive -Path "C:\ds2api.zip" -DestinationPath $Ds2apiDir -Force
      } catch {
          Write-Host "[!] LỖI CHÍ MẠNG: Tải ds2api thất bại." -ForegroundColor Red
          Exit 1
      }

      Write-Host "[*] Gỡ bỏ cờ bảo mật Mark-of-the-Web (MotW)..." -ForegroundColor Cyan
      Get-ChildItem -Path $Ds2apiDir -Recurse | Unblock-File -ErrorAction SilentlyContinue

      $Ds2apiExe = (Get-ChildItem -Path $Ds2apiDir -Filter "ds2api.exe" -Recurse | Select-Object -First 1).FullName
      $Ds2apiWorkDir = Split-Path $Ds2apiExe

      # CHUẨN HÓA ENCODING: XÓA BỎ KÝ TỰ ẨN (BOM) KHỎI JSON
      $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)

      $Ds2apiConfig = @{
          host = "127.0.0.1"
          port = 5001
          api_key = "local-key"
          accounts = @( @{ token = $env:DEEPSEEK_TOKEN; platform = "deepseek" } )
      } | ConvertTo-Json -Depth 5
      [System.IO.File]::WriteAllText("$Ds2apiWorkDir\config.json", $Ds2apiConfig, $Utf8NoBom)

      Write-Host "[*] Kích hoạt tiến trình ds2api..." -ForegroundColor Cyan
      $LogFile = "$Ds2apiWorkDir\crash_log.txt"
      
      $StartInfo = New-Object System.Diagnostics.ProcessStartInfo
      $StartInfo.FileName = $Ds2apiExe
      $StartInfo.WorkingDirectory = $Ds2apiWorkDir
      $StartInfo.WindowStyle = 'Hidden'
      $StartInfo.RedirectStandardOutput = $true
      $StartInfo.RedirectStandardError = $true
      $StartInfo.UseShellExecute = $false
      
      $Process = New-Object System.Diagnostics.Process
      $Process.StartInfo = $StartInfo
      $Process.Start() | Out-Null
      
      $null = Register-ObjectEvent -InputObject $Process -EventName OutputDataReceived -Action { Add-Content -Path $LogFile -Value $EventArgs.Data }
      $null = Register-ObjectEvent -InputObject $Process -EventName ErrorDataReceived -Action { Add-Content -Path $LogFile -Value $EventArgs.Data }
      $Process.BeginOutputReadLine()
      $Process.BeginErrorReadLine()

      if (!(Wait-ForPort "127.0.0.1" 5001 -TimeoutSec 20)) {
          Write-Host "[!] LỖI CHÍ MẠNG: ds2api sập hoặc không mở cổng 5001!" -ForegroundColor Red
          Write-Host "--- NGUYÊN NHÂN TỪ LOG CỦA DS2API ---" -ForegroundColor Yellow
          if (Test-Path $LogFile) { Get-Content $LogFile | Select-Object -Last 15 | ForEach-Object { Write-Host $_ -ForegroundColor Red } }
          Write-Host "-------------------------------------" -ForegroundColor Yellow
          Exit 1
      }
      Write-Host "[+] Dịch vụ ds2api đã hoạt động ổn định." -ForegroundColor Green

      Write-Host "[*] Khởi tạo lưới định tuyến MITM 9router..." -ForegroundColor Yellow
      npm install -g 9router | Out-Null
      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
      $9routerCmd = $env:APPDATA + '\npm\9router.cmd'
      if (!(Test-Path $9routerCmd)) { $9routerCmd = (Get-Command "9router" -ErrorAction SilentlyContinue).Source }

      $9rConfigDir = "$env:USERPROFILE\.9router"
      if (!(Test-Path $9rConfigDir)) { New-Item -ItemType Directory -Path $9rConfigDir -Force | Out-Null }
      
      $Providers = @{ "ds2api-local" = @{ id="ds2api-local"; name="DeepSeek V4 VIP"; type="openai"; baseUrl="http://127.0.0.1:5001/v1"; apiKey="local-key"; models=@("deepseek-v4-flash","deepseek-v4-pro","deepseek-v4-flash-nothinking"); enabled=$true } } | ConvertTo-Json -Depth 5
      [System.IO.File]::WriteAllText("$9rConfigDir\providers.json", $Providers, $Utf8NoBom)
      
      $Settings = @{ mitm = @{ enabled = $true; port = 9090 }; mappings = @( @{ from="gemini-3.1-pro-high"; to="ds2api-local/deepseek-v4-pro" }, @{ from="gemini-3.1-pro-low"; to="ds2api-local/deepseek-v4-flash" }, @{ from="gemini-3-flash"; to="ds2api-local/deepseek-v4-flash-nothinking" } ) } | ConvertTo-Json -Depth 5
      [System.IO.File]::WriteAllText("$9rConfigDir\settings.json", $Settings, $Utf8NoBom)

      Start-Process -FilePath $9routerCmd -ArgumentList "start", "--mitm" -WindowStyle Hidden
      if (!(Wait-ForPort "127.0.0.1" 9090)) { Write-Host "[!] LỖI CHÍ MẠNG: 9router không hoạt động." -ForegroundColor Red; Exit 1 }

      $CertPath = "$9rConfigDir\certs\ca.crt"
      if (Wait-ForFile $CertPath) { Import-Certificate -FilePath $CertPath -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null }

      Write-Host "[*] Kích hoạt vỏ bọc Antigravity IDE..." -ForegroundColor Yellow
      try {
          Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile "$env:TEMP\Antigravity_Setup.exe" -TimeoutSec 120
          Stop-Process -Name "Antigravity*" -Force -ErrorAction SilentlyContinue
          Start-Process "$env:TEMP\Antigravity_Setup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          Write-Host "[+] HỆ THỐNG PHANTOM NODE ĐÃ TRIỂN KHAI THÀNH CÔNG." -ForegroundColor Green
      } catch {
          Write-Host "[!] LỖI CHÍ MẠNG: Cài đặt IDE thất bại." -ForegroundColor Red; Exit 1
      }

build: off
