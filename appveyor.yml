# ==============================================================================
#   PHANTOM NODE - SESSION RETRIEVAL PHASE (RDP ENABLER)
#   Target: Extract Antigravity session.zip using RD Client on Phone
#   Instructions:
#     1. Push this file as 'appveyor.yml' to your repository.
#     2. Start the build on AppVeyor.
#     3. Check AppVeyor console logs for RDP IP, Port, Username, and Password.
#     4. Connect using Microsoft Remote Desktop (RD Client) on your phone.
#     5. Manually log in to Google/GitHub inside Antigravity IDE on the VM.
#     6. Run the PowerShell command below to zip and upload your session.
# ==============================================================================

version: 1.0.{build}
image: Visual Studio 2019

shallow_clone: true
clone_depth: 1

environment:
  # Set your custom RDP password
  APPVEYOR_RDP_PASSWORD: "HieuDz@123456"
  APP_DOWNLOAD_URL: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe"

init:
  # Enable RDP and pause the build to allow connection
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

build: off

install:
  - ps: |
      # Disable Windows Defender
      Set-MpPreference -DisableRealtimeMonitoring $true
      
      # Install Google Chrome (Needed for Google Auth rendering)
      Write-Host "[*] Installing Chrome Standalone..." -ForegroundColor Cyan
      Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "C:\chrome_setup.exe"
      Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait
      
      # Install Antigravity IDE
      Write-Host "[*] Installing Antigravity IDE (Silent)..." -ForegroundColor Yellow
      $setupFile = "C:\Antigravity_Setup.exe"
      Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile $setupFile
      Start-Process $setupFile -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

      # Create Desktop Shortcut
      $exePath = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
      $ws = New-Object -comObject WScript.Shell
      $s = $ws.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity IDE.lnk")
      $s.TargetPath = $exePath
      $s.Save()
      Write-Host "[*] Setup complete. Desktop shortcut created." -ForegroundColor Green

test_script:
  - ps: |
      Write-Host "================================================================" -ForegroundColor Green
      Write-Host " PHANTOM NODE: RDP SESSION RETRIEVAL IS READY" -ForegroundColor Green
      Write-Host "================================================================" -ForegroundColor Green
      Write-Host "1. Connect using Microsoft Remote Desktop on your phone."
      Write-Host "2. Double click 'Antigravity IDE' on the desktop."
      Write-Host "3. Log in to your Google and GitHub accounts manually."
      Write-Host "4. Once logged in, open PowerShell on the VM and run:"
      Write-Host '   Compress-Archive -Path "$env:USERPROFILE\.antigravity" -DestinationPath "$env:USERPROFILE\Desktop\session.zip" -Force'
      Write-Host "5. Upload 'session.zip' from Desktop to gofile.io or file.io to get a direct link."
      Write-Host "================================================================" -ForegroundColor Green
      
      # Keep-alive loop for 90 minutes to prevent build from exiting
      for ($i = 1; $i -le 90; $i++) {
          $ram = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024 / 1024, 2)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Keep-Alive: $i/90 mins | RAM Free: ${ram}GB"
          Start-Sleep -Seconds 60
          $wsh = New-Object -ComObject WScript.Shell
          $wsh.SendKeys("{F15}")
      }
