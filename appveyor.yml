#   Target: Antigravity IDE (Google Pro) - Silent Install & Auto-Login
#   Constraints: 90 Minutes Hard-Stop | Zero Backup | 1000+ Lines
# ==============================================================================

version: 18.2.{build}
image: Visual Studio 2019

shallow_clone: true
clone_depth: 1

branches:
  only:
    - main

environment:
  # --- CREDENTIALS ---
  GITHUB_TOKEN: "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"
  GOOGLE_EMAIL: "buixuanbang01981@gmail.com"
  GOOGLE_PASS_B64: "U29uMjJ0cTIwMTE=" 
  APPVEYOR_RDP_PASSWORD: "HieuDz@123456"
  
  # --- APPLICATION STACK ---
  APP_NAME: "Antigravity"
  APP_DOWNLOAD_URL: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe"

matrix:
  fast_finish: true

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: |
      # MODULE 1: SYSTEM HARDENING (EXTREME PERFORMANCE)
      $ErrorActionPreference = "SilentlyContinue"
      Set-MpPreference -DisableRealtimeMonitoring $true
      $services = @("wsearch", "DiagTrack", "SysMain", "WerSvc", "WaasMedicSvc", "edgeupdate")
      foreach ($svc in $services) { 
          Stop-Service -Name $svc -Force
          Set-Service -Name $svc -StartupType Disabled 
      }
      Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 24
      powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

install:
  - ps: |
      # MODULE 2: SILENT INSTALLATION (FIXED FOR ZERO-TOUCH)
      Write-Host "[*] Downloading Antigravity Setup..." -ForegroundColor Cyan
      $setupFile = "C:\Antigravity_Setup.exe"
      Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile $setupFile
      
      Write-Host "[*] Executing Silent Install (No dialogs)..." -ForegroundColor Yellow
      # /VERYSILENT /SUPPRESSMSGBOXES suppresses the License Agreement and other prompts.
      Start-Process $setupFile -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
      
      # Identity Configuration
      $configDir = "$env:USERPROFILE\.antigravity"
      New-Item -ItemType Directory -Path $configDir -Force | Out-Null
      $configJson = @{
          auth = @{ github_token = $env:GITHUB_TOKEN }
          settings = @{ telemetry = $false; auto_save = $true }
      } | ConvertTo-Json
      Set-Content -Path "$configDir\config.json" -Value $configJson -Encoding UTF8

      # Detect EXE Path (AppData based on typical Inno Setup for User level)
      $exePath = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
      if (!(Test-Path $exePath)) { $exePath = "C:\Users\appveyor\AppData\Local\Programs\Antigravity\Antigravity.exe" }
      
      # Desktop Shortcuts
      $ws = New-Object -comObject WScript.Shell
      $s = $ws.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity IDE.lnk")
      $s.TargetPath = $exePath
      $s.Save()
      
      [Environment]::SetEnvironmentVariable("ANTIGRAVITY_EXE", $exePath, "Process")

build: off

test_script:
  - ps: |
      # MODULE 3: AUTOMATED LOGIN & 90-MINUTE LIFECYCLE
      Write-Host "=== INITIATING AUTO-LOGIN SEQUENCE ===" -ForegroundColor Cyan
      $wsh = New-Object -ComObject WScript.Shell
      $plainPass = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:GOOGLE_PASS_B64))
      
      # Launch and Login
      Start-Process $env:ANTIGRAVITY_EXE
      Write-Host "[*] Waiting for IDE UI to load (30s)..." -ForegroundColor Yellow
      Start-Sleep -Seconds 30
      
      # Inject Email
      $wsh.SendKeys($env:GOOGLE_EMAIL)
      Start-Sleep -Seconds 2
      $wsh.SendKeys('{ENTER}')
      Write-Host "[*] Email submitted. Waiting for password screen..." -ForegroundColor Yellow
      Start-Sleep -Seconds 10
      
      # Inject Password
      $wsh.SendKeys($plainPass)
      Start-Sleep -Seconds 2
      $wsh.SendKeys('{ENTER}')
      Write-Host "[*] Password submitted. PUSH NOTIFICATION SENT TO PHONE!" -ForegroundColor Green

      # Lifespan: 90 Minutes
      $maxMinutes = 90
      for ($i = 1; $i -le $maxMinutes; $i++) {
          $wsh.SendKeys('{F15}')
          $ram = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024 / 1024, 2)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Monitor: `$i/90m | RAM Free: `$${ram}GB"
          
          if ($i % 15 -eq 0) { 
              [System.GC]::Collect() 
              Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 60
      }
      
      # ZERO BACKUP PROTOCOL: SELF-DESTRUCTION
      Write-Host "[!] SESSION EXPIRED. PURGING DATA..." -ForegroundColor Red
      Remove-Item "$env:LOCALAPPDATA\Programs\Antigravity\*" -Recurse -Force -ErrorAction SilentlyContinue
      Remove-Item "$env:USERPROFILE\.antigravity\*" -Recurse -Force -ErrorAction SilentlyContinue
      Write-Host "[!] PURGE COMPLETE. EXITING." -ForegroundColor Red
      Exit-Process 0

