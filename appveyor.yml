gId" -Value "ChromeHTML"\n      }\n      Write-Host "[*] Chrome đã được đặt làm mặc định." -ForegroundColor Green\n\ninstall:\n  - ps: |\n      # MODULE 2: CÀI ĐẶT IM LẶNG & TIỀN CẤU HÌNH (PRE-CONFIG)\n      Write-Host "[*] Đang cài đặt Chrome Standalone..." -ForegroundColor Cyan\n      Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "C:\chrome_setup.exe"\n      Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait\n      \n      Write-Host "[*] Đang cài đặt Antigravity IDE (Silent)..." -ForegroundColor Yellow\n      $setupFile = "C:\Antigravity_Setup.exe"\n      Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile $setupFile\n      Start-Process $setupFile -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait\n      \n      # MODULE 3: BƠM CẤU HÌNH BỎ QUA SETUP WIZARD (BYPASS THEME/MODE) [cite: 1000113072.mp4]\n      $configDir = "$env:USERPROFILE\.antigravity"\n      if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force }\n      \n      # Tạo tệp cấu hình giả lập trạng thái đã chọn Theme, Mode và nạp Token GitHub\n      $configJson = @{\n          auth = @{ \n              github_token = $env:GITHUB_TOKEN\n              auto_login = $true\n          }\n          settings = @{ \n              telemetry = $false\n              theme = "Modern" # [cite: 1000113072.mp4]\n              agent_mode = "agent-driven-development" # [cite: 1000113072.mp4]\n              auto_save = $true\n              onboarding_complete = $true # Lệnh quan trọng để bỏ qua màn hình chào mừng\n          }\n      } | ConvertTo-Json\n      Set-Content -Path "$configDir\config.json" -Value $configJson -Encoding UTF8\n      Write-Host "[*] Đã nạp Token GitHub và bỏ qua Setup Wizard." -ForegroundColor Green\n\n      # Shortcut setup\n      $exePath = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"\n      $ws = New-Object -comObject WScript.Shell\n      $s = $ws.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity IDE.lnk")\n      $s.TargetPath = $exePath\n      $s.Save()\n\nbuild: off\n\ntest_script:\n  - ps: |\n      # MODULE 4: AUTO-LOGIN SEQUENCE (EMAIL -> PASSWORD -> PHONE)\n      Write-Host "=== ĐANG THỰC THI AUTO-LOGIN PHANTOM ===" -ForegroundColor Cyan\n      $wsh = New-Object -ComObject WScript.Shell\n      $plainPass = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:GOOGLE_PASS_B64))\n      \n      $exePath = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"\n      Start-Process $exePath\n      Write-Host "[*] Đang chờ IDE bỏ qua Setup Wizard và mở màn hình Login Google (35s)..." -ForegroundColor Yellow\n      Start-Sleep -Seconds 35\n      \n      # Kịch bản bơm phím ảo (Bypass Google Login)\n      # 1. Nhập Email\n      $wsh.SendKeys($env:GOOGLE_EMAIL)\n      Start-Sleep -Seconds 2\n      $wsh.SendKeys('{ENTER}')\n      Write-Host "[*] Đã gửi Email. Chờ màn hình mật khẩu..." -ForegroundColor Yellow\n      Start-Sleep -Seconds 12\n      \n      # 2. Nhập Mật khẩu\n      $wsh.SendKeys($plainPass)\n      Start-Sleep -Seconds 2\n      $wsh.SendKeys('{ENTER}')\n      Write-Host "[*] ĐÃ ĐẨY XÁC THỰC! HÃY CHỜ RUNG ĐIỆN THOẠI." -ForegroundColor Green\n\n      # Duy trì 90 phút (Hard-Stop) [cite: Saved Information]\n      for ($i = 1; $i -le 90; $i++) {\n          $wsh.SendKeys('{F15}') # Chống AFK\n          $ram = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024 / 1024, 2)\n          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Monitor: `$i/90m | RAM Free: `$${ram}GB"\n          Start-Sleep -Seconds 60\n      }\n      \n      # ZERO BACKUP PROTOCOL\n      Remove-Item "$env:LOCALAPPDATA\Programs\Antigravity\*" -Recurse -Force\n      Exit-Process 0\n\n# ------------------------------------------------------------------------------\n# PHANTOM MODULE 01: AGENTIC STABILITY AUDIT [cite: User Summary]\n# ------------------------------------------------------------------------------\