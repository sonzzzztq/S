version: 17.0.{build}
image: Visual Studio 2019

# [OPTIMIZATION]
shallow_clone: true
clone_depth: 1

branches:
  only:
    - main

environment:
  # --- IDENTITY CORE ---
  GITHUB_TOKEN: "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"
  GOOGLE_EMAIL: "buixuanbang01981@gmail.com"
  GOOGLE_PASS_B64: "U29uMjJ0cTIwMTE=" 
  APPVEYOR_RDP_PASSWORD: "HieuDz@123456"
  
  # --- APPLICATION STACK ---
  APP_NAME: "Antigravity"
  APP_DOWNLOAD_URL: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe"

matrix:
  fast_finish: true

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: |
      # ==============================================================================
      # PHANTOM NODE: KERNEL OPTIMIZATION & HARDENING
      # ==============================================================================
      $ErrorActionPreference = "SilentlyContinue"
      
      function Invoke-SystemPurge {
          Write-Host "[PHANTOM] Executing Deep System Purge..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true
          
          $servicesToKill = @("wsearch", "DiagTrack", "SysMain", "WerSvc", "WaasMedicSvc", "edgeupdate", "bits", "Spooler", "MapsBroker")
          foreach ($svc in $servicesToKill) { 
              Stop-Service -Name $svc -Force
              Set-Service -Name $svc -StartupType Disabled 
          }
          
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 24
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
      }
      Invoke-SystemPurge

install:
  - ps: |
      # ==============================================================================
      # PHANTOM NODE: ENVIRONMENT SETUP & AUTO-LOGIN INJECTION
      # ==============================================================================
      [Environment]::SetEnvironmentVariable("GITHUB_TOKEN", $env:GITHUB_TOKEN, "Machine")
      
      # 1. Install Chrome
      Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "C:\chrome_setup.exe"
      Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait
      
      # 2. Deploy Antigravity IDE
      $binDir = "C:\Tools\Antigravity"
      New-Item -ItemType Directory -Path $binDir -Force | Out-Null
      Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile "$binDir\Antigravity.exe"

      # 3. Configure Internal Identity
      $configDir = "$env:USERPROFILE\.antigravity"
      New-Item -ItemType Directory -Path $configDir -Force | Out-Null
      $configJson = @{
          auth = @{ github_token = $env:GITHUB_TOKEN }
          settings = @{ telemetry = $false; auto_save = $true }
      } | ConvertTo-Json
      Set-Content -Path "$configDir\config.json" -Value $configJson -Encoding UTF8

      # 4. Desktop Shortcuts
      $ws = New-Object -comObject WScript.Shell
      $s = $ws.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity IDE.lnk")
      $s.TargetPath = "$binDir\Antigravity.exe"
      $s.Save()

build: off

test_script:
  - ps: |
      # ==============================================================================
      # PHANTOM NODE: AUTONOMOUS LOGIN & LIFECYCLE MANAGEMENT
      # ==============================================================================
      Write-Host "=== BẮT ĐẦU QUY TRÌNH AUTO-LOGIN GOOGLE ===" -ForegroundColor Cyan
      $wsh = New-Object -ComObject WScript.Shell
      $plainPass = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:GOOGLE_PASS_B64))
      
      Start-Process "C:\Tools\Antigravity\Antigravity.exe"
      Start-Sleep -Seconds 15
      
      $wsh.SendKeys($env:GOOGLE_EMAIL)
      Start-Sleep -Seconds 2
      $wsh.SendKeys('{ENTER}')
      Start-Sleep -Seconds 5
      
      $wsh.SendKeys($plainPass)
      Start-Sleep -Seconds 2
      $wsh.SendKeys('{ENTER}')
      Write-Host "[*] ĐÃ ĐẨY THÔNG BÁO XÁC THỰC VỀ ĐIỆN THOẠI!" -ForegroundColor Green
      
      # --------------------------------------------------------------------------
      # QUẢN LÝ VÒNG ĐỜI (LIFECYCLE): TỐI ĐA 90 PHÚT & KHÔNG BACKUP
      # --------------------------------------------------------------------------
      $maxMinutes = 90
      
      for ($i = 1; $i -le $maxMinutes; $i++) {
          $wsh.SendKeys('{F15}')
          $ram = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024 / 1024, 2)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Uptime: `$i/90m | RAM: `$${ram}GB"
          
          if ($i % 15 -eq 0) { 
              [System.GC]::Collect() 
              Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          Start-Sleep -Seconds 60
      }
      
      # Tự hủy dữ liệu sau 90 phút (Zero Backup Protocol)
      Write-Host "[PHANTOM] HẾT THỜI GIAN ($maxMinutes PHÚT). THỰC THI GIAO THỨC HỦY DỮ LIỆU..." -ForegroundColor Red
      Remove-Item "C:\Tools\Antigravity\*" -Recurse -Force -ErrorAction SilentlyContinue
      Remove-Item "$env:USERPROFILE\.antigravity\*" -Recurse -Force -ErrorAction SilentlyContinue
      Write-Host "[PHANTOM] DỮ LIỆU ĐÃ BỊ XÓA. KẾT THÚC PHIÊN LÀM VIỆC." -ForegroundColor Red
      Exit-Process 0

